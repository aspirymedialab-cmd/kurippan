# Base44 sandbox dev environment.
#
# Runs the app straight from the cloned source with the Vite dev server
# (`npm run dev`), so edits are reflected in the preview without a rebuild.
# The repository's own Dockerfile / production build is deliberately not used.
services:
  web:
    # Plain runtime image + bind-mounted source: never a prebuilt app image.
    image: node:22
    working_dir: /app
    labels:
      base44.project: "Tamil Word Editor"
      base44.kind: "web"
      base44.port: "3000"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Dependencies live in a volume so the bind mount cannot shadow them.
      - node_modules:/app/node_modules
    env_file:
      # Platform-delivered secrets (e.g. GEMINI_API_KEY). Listed LAST so a value
      # from the secrets dashboard always wins. Never add those keys under
      # `environment:` — that would permanently outrank the dashboard value.
      - /run/base44/app.env
    environment:
      # Vite >= 6.1 appends this to server.allowedHosts (set by the platform for
      # the preview proxy's hostname).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    # Install/sync from the lockfile on every start, then exec the dev server.
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    healthcheck:
      # Real request against the dev server, using the node already in the image.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: on-failure

volumes:
  node_modules:
